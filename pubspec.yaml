name: powerlifting_tracker
description: Offline-first powerlifting workout tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^3.0.0
  go_router: ^14.2.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  wakelock_plus: ^1.2.8
  riverpod_annotation: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
